<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestras películas</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--text:#eceef2;--muted:#8b93a3;--accent:#f5b83d;--danger:#e5484d;--line:#2a2f3a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1;min-width:140px}
  .who{font-size:13px;color:var(--muted);cursor:pointer}
  .btn{background:var(--accent);color:#111;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:var(--card2);color:var(--text)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
  input[type=date]{color-scheme:dark}
  main{max-width:1180px;margin:0 auto;padding:16px}
  .layout{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
  aside{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  @media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}}
  aside summary{cursor:pointer;font-weight:700;list-style:none}
  aside summary small{color:var(--muted);font-weight:400}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .tile{background:var(--card2);border-radius:10px;padding:10px}
  .tile b{display:block;font-size:20px;color:var(--accent)}
  .tile span{font-size:12px;color:var(--muted)}
  .st h4{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .st .line{font-size:13px;margin:4px 0}
  .st .line small{color:var(--muted)}
  .bar{display:grid;grid-template-columns:96px 1fr 26px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
  .bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .track{background:var(--card2);border-radius:6px;height:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .bar b{text-align:right;color:var(--muted);font-weight:600}
  .tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tools input{flex:2;min-width:140px}.tools select{flex:1;min-width:120px}
  .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet.wide{max-width:760px}
  .imp{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .imp input[type=checkbox]{width:20px;height:20px;margin-top:4px;flex:none}
  .imp .grow{flex:1;min-width:0}
  .imp select{margin-top:6px;padding:8px}
  .imp img,.imp .np{width:40px;height:60px;object-fit:cover;border-radius:6px;background:var(--card2);flex:none}
  .imp.off{opacity:.55}
  .small{padding:6px 10px;font-size:13px;margin-top:6px}
  .sub{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
  .card img,.noposter{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--card2)}
  .noposter{display:flex;align-items:center;justify-content:center;color:var(--muted);padding:8px;text-align:center}
  .card .info{padding:10px}
  .card .t{font-weight:600;font-size:14px;margin-bottom:2px}
  .card .y{color:var(--muted);font-size:12px}
  .avg{display:inline-block;margin-top:6px;background:var(--accent);color:#111;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
  .avg.none{background:var(--card2);color:var(--muted)}
  .mini{font-size:12px;color:var(--muted);margin-top:4px}
  .empty{text-align:center;color:var(--muted);padding:60px 16px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:700px){.overlay{align-items:center}}
  .sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
  @media(min-width:700px){.sheet{border-radius:18px}}
  .row{display:flex;gap:14px}
  .row img{width:110px;border-radius:10px;align-self:flex-start}
  .sheet h2{margin:0 0 4px;font-size:20px}
  .meta{margin:8px 0;font-size:13px;color:var(--muted)}
  .meta b{color:var(--text);font-weight:600}
  .overview{color:var(--muted);font-size:14px;margin:10px 0}
  .block{background:var(--card2);border-radius:12px;padding:12px;margin-top:12px}
  .block h3{margin:0 0 8px;font-size:14px}
  .block.mine{border:1px solid var(--accent)}
  .block label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .block input,.block select,.block textarea{background:var(--card)}
  .two{display:flex;gap:8px}.two>div{flex:1}
  .rate{display:flex;gap:10px;align-items:center}
  .rate input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
  .rate .val{width:44px;text-align:right;font-weight:700;color:var(--accent)}
  .res{display:flex;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
  .res:hover{background:var(--card2)}
  .res img,.res .np{width:44px;height:66px;object-fit:cover;border-radius:6px;background:var(--card2);flex:none}
  .res .sub{color:var(--muted);font-size:12px}
  .gate{max-width:380px;margin:12vh auto;padding:20px}
  .gate h1{margin-top:0}
  .gate label{display:block;margin:14px 0 6px;color:var(--muted);font-size:14px}
  .err{color:var(--danger);font-size:14px;margin-top:10px}
  .actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#111;padding:10px 18px;border-radius:999px;font-weight:600;z-index:50}
</style>
</head>
<body>

<!-- Pantalla de entrada -->
<div id="gate" class="gate">
  <h1>🎬 Nuestras películas</h1>
  <label>Código compartido</label>
  <input id="codeInput" placeholder="mínimo 6 caracteres" autocapitalize="off" autocomplete="off">
  <label>¿Quién eres?</label>
  <select id="whoSelect"></select>
  <div class="actions"><button class="btn" id="enterBtn">Entrar</button></div>
  <div id="gateErr" class="err hidden"></div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header>
    <h1>🎬 Nuestras películas</h1>
    <span class="who" id="whoLabel" title="Cambiar de usuario / salir"></span>
    <button class="btn ghost" id="importBtn">⬆ Importar</button>
    <button class="btn" id="addBtn">+ Añadir</button>
  </header>
  <main>
    <div class="layout">
      <aside>
        <details id="statsBox" open>
          <summary>📊 Estadísticas <small id="statsScope"></small></summary>
          <div id="stats" class="st"></div>
        </details>
      </aside>
      <section>
        <div class="tools">
          <input id="filter" placeholder="Buscar (título, cine, director…)">
          <select id="year"></select>
          <select id="sort">
            <option value="watched">Fecha en que la vimos</option>
            <option value="recent">Añadidas recientemente</option>
            <option value="avg">Mejor nota media</option>
            <option value="title">Título A-Z</option>
          </select>
        </div>
        <div id="grid" class="grid"></div>
        <div id="empty" class="empty hidden"></div>
      </section>
    </div>
  </main>
</div>

<!-- Modal: añadir -->
<div id="addModal" class="overlay hidden">
  <div class="sheet">
    <h2>Añadir película</h2>
    <input id="searchInput" placeholder="Busca por título…" style="margin-top:10px">
    <div id="results" style="margin-top:10px"></div>
    <div class="actions"><button class="btn ghost" id="closeAdd">Cerrar</button></div>
  </div>
</div>

<!-- Modal: importar -->
<div id="importModal" class="overlay hidden">
  <div class="sheet wide">
    <h2>Importar películas</h2>
    <div class="sub" style="margin:6px 0 10px">Elige el archivo <b>pelis-import.json</b>. Se buscará cada título en TMDB y podrás revisar las coincidencias antes de importar.</div>
    <input type="file" id="importFile" accept=".json,application/json">
    <div id="importStatus" class="sub" style="margin-top:10px"></div>
    <div id="importList"></div>
    <div class="actions"><button class="btn" id="importGo" disabled>Importar</button><button class="btn ghost" id="importClose">Cerrar</button></div>
  </div>
</div>

<!-- Modal: detalle -->
<div id="detailModal" class="overlay hidden">
  <div class="sheet" id="detailSheet"></div>
</div>

<script type="module">
import { firebaseConfig, TMDB_API_KEY, PEOPLE } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Cines sugeridos (puedes escribir cualquier otro al registrar la visita;
// los que uséis se añaden solos a las sugerencias). Edita esta lista a tu gusto.
const DEFAULT_CINEMAS = [
  "Kinepolis Alicante",
  "Kinepolis ScreenX Alicante",
  "Colci Benidorm",
  "Cinesa",
  "Cine ABC",
  "Kinepolis IMAX Valencia",
];
const LANGS = ["Español", "VOSE", "VO"];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IMG = "https://image.tmdb.org/t/p/";
const todayStr = () => new Date().toLocaleDateString("sv"); // YYYY-MM-DD en hora local
const fmtDate = (s) => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const fmtRuntime = (n) => n ? `${Math.floor(n / 60)} h ${String(n % 60).padStart(2, "0")} min` : "";

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}

let db, moviesCol, unsub = null;
let movies = [];
let me = null;       // id de la persona
let room = null;     // código

// ---------- Entrada ----------
$("whoSelect").innerHTML = PEOPLE.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");

function enter(code, who) {
  code = code.trim().toLowerCase();
  if (code.length < 6) { showErr("El código debe tener al menos 6 caracteres."); return; }
  if (firebaseConfig.projectId === "PEGA_AQUI") { showErr("Falta rellenar config.js (ver README)."); return; }
  room = code; me = who;
  localStorage.setItem("peli_session", JSON.stringify({ code, who }));
  if (!db) db = getFirestore(initializeApp(firebaseConfig));
  moviesCol = collection(db, "rooms", room, "movies");
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("whoLabel").textContent = "👤 " + nameOf(me) + " · salir";
  if (unsub) unsub();
  unsub = onSnapshot(moviesCol, snap => {
    movies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
    if (openId) renderDetail(openId);
    backfill();
  }, err => { console.error(err); alert("No se pudo conectar con Firebase. Revisa config.js y las reglas."); });
}
function showErr(m){ const e=$("gateErr"); e.textContent=m; e.classList.remove("hidden"); }
$("enterBtn").onclick = () => enter($("codeInput").value, $("whoSelect").value);
$("codeInput").addEventListener("keydown", e => { if (e.key === "Enter") $("enterBtn").click(); });
$("whoLabel").onclick = () => { localStorage.removeItem("peli_session"); location.reload(); };

const nameOf = (id) => (PEOPLE.find(p => p.id === id) || {}).name || id;

try {
  const s = JSON.parse(localStorage.getItem("peli_session") || "null");
  if (s && PEOPLE.some(p => p.id === s.who)) enter(s.code, s.who);
} catch {}

// ---------- TMDB: ficha de la película ----------
async function fetchDetails(id) {
  const r = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=es-ES&append_to_response=credits`);
  if (!r.ok) throw new Error("TMDB " + r.status);
  const d = await r.json();
  return {
    releaseDate: d.release_date || "",
    genres: (d.genres || []).map(g => g.name),
    director: (d.credits?.crew || []).filter(c => c.job === "Director").map(c => c.name).join(", "),
    runtime: d.runtime || null,
  };
}
// Rellena la ficha de las películas antiguas que aún no la tienen
const backfilled = new Set();
async function backfill() {
  if (TMDB_API_KEY === "PEGA_AQUI") return;
  for (const m of movies) {
    if (m.releaseDate !== undefined || backfilled.has(m.id)) continue;
    backfilled.add(m.id);
    try { await updateDoc(doc(moviesCol, m.id), await fetchDetails(m.id)); }
    catch (e) { console.warn("No se pudo completar", m.title, e); }
  }
}

// ---------- Lista ----------
function avgOf(m) {
  const v = Object.values(m.ratings || {}).filter(x => typeof x === "number");
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
const fmt = (n) => n == null ? "–" : (Math.round(n * 10) / 10).toString().replace(".", ",");
const mean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

let yearFilter = String(new Date().getFullYear()); // por defecto: el año actual

function syncYearSelect() {
  const ys = new Set([String(new Date().getFullYear())]);
  let hasNone = false;
  movies.forEach(m => { if (m.watchedOn) ys.add(m.watchedOn.slice(0, 4)); else hasNone = true; });
  const opts = [["all", "Todos los años"], ...[...ys].sort().reverse().map(y => [y, y]), ...(hasNone ? [["none", "Sin fecha"]] : [])];
  if (!opts.some(o => o[0] === yearFilter)) yearFilter = "all";
  const sig = opts.map(o => o[0]).join("|");
  const sel = $("year");
  if (sel.dataset.sig !== sig) {
    sel.innerHTML = opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join("");
    sel.dataset.sig = sig;
  }
  sel.value = yearFilter;
}

function getFiltered() {
  const q = $("filter").value.trim().toLowerCase();
  return movies.filter(m => {
    if (yearFilter === "none") { if (m.watchedOn) return false; }
    else if (yearFilter !== "all") { if (!m.watchedOn || m.watchedOn.slice(0, 4) !== yearFilter) return false; }
    return !q || [m.title, m.cinema, m.director, m.lang, ...(m.genres || [])].some(x => (x || "").toLowerCase().includes(q));
  });
}

function render() {
  syncYearSelect();
  const list = getFiltered();
  const sort = $("sort").value;
  list.sort((a, b) => {
    if (sort === "avg") return (avgOf(b) ?? -1) - (avgOf(a) ?? -1);
    if (sort === "title") return (a.title || "").localeCompare(b.title || "", "es");
    if (sort === "watched") return (b.watchedOn || "").localeCompare(a.watchedOn || "");
    return (b.createdAt?.seconds ?? 9e9) - (a.createdAt?.seconds ?? 9e9);
  });
  const emp = $("empty");
  emp.classList.toggle("hidden", list.length > 0);
  emp.innerHTML = movies.length === 0
    ? "Aún no hay películas.<br>Pulsa “+ Añadir” para empezar."
    : "Ninguna película con estos filtros.<br>Prueba otro año o “Todos los años”.";
  $("grid").innerHTML = list.map(m => {
    const a = avgOf(m);
    const mini = PEOPLE.map(p => `${esc(p.name)}: ${fmt(m.ratings?.[p.id])}`).join(" · ");
    const pills = [m.watchedOn ? "📅 " + fmtDate(m.watchedOn) : "", m.lang ? "🗣️ " + m.lang : "", m.cinema ? "📍 " + m.cinema : ""]
      .filter(Boolean).map(t => `<span class="pill" title="${esc(t)}">${esc(t)}</span>`).join("");
    return `<div class="card" data-id="${m.id}">
      ${m.poster ? `<img loading="lazy" src="${IMG}w342${m.poster}" alt="">` : `<div class="noposter">${esc(m.title)}</div>`}
      <div class="info"><div class="t">${esc(m.title)}</div><div class="y">${esc(m.year || "")}</div>
      <span class="avg ${a == null ? "none" : ""}">★ ${fmt(a)}</span><div class="mini">${mini}</div>
      ${pills ? `<div class="pills">${pills}</div>` : ""}</div></div>`;
  }).join("");
  renderStats(list);
}
$("grid").onclick = (e) => { const c = e.target.closest(".card"); if (c) openDetail(c.dataset.id); };
$("filter").oninput = render; $("sort").onchange = render;
$("year").onchange = () => { yearFilter = $("year").value; render(); };
if (matchMedia("(max-width:800px)").matches) $("statsBox").open = false;

// ---------- Estadísticas (sobre la lista ya filtrada) ----------
const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const countBy = (arr, keyFn) => {
  const o = {};
  arr.forEach(x => [].concat(keyFn(x)).forEach(k => { if (k) o[k] = (o[k] || 0) + 1; }));
  return Object.entries(o).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "es"));
};
const bars = (entries) => {
  const max = Math.max(1, ...entries.map(e => e[1]));
  return entries.map(([k, v]) => `<div class="bar"><span title="${esc(k)}">${esc(k)}</span><div class="track"><i style="width:${v / max * 100}%"></i></div><b>${v}</b></div>`).join("");
};

function renderStats(list) {
  $("statsScope").textContent = "· " + (yearFilter === "all" ? "todos los años" : yearFilter === "none" ? "sin fecha" : yearFilter);
  const box = $("stats");
  if (!list.length) { box.innerHTML = `<div class="sub" style="margin-top:10px">Sin datos con estos filtros.</div>`; return; }

  const mins = list.reduce((s, m) => s + (m.runtime || 0), 0);
  const avgAll = mean(list.map(avgOf).filter(x => x != null));
  const tiles = [
    [list.length, "Películas"],
    [mins ? fmtRuntime(mins).replace(/ min$/, "m").replace(" h ", "h ") : "–", "En pantalla"],
    ["★ " + fmt(avgAll), "Nota media"],
    ...PEOPLE.map(p => ["★ " + fmt(mean(list.map(m => m.ratings?.[p.id]).filter(x => typeof x === "number"))), "Media " + p.name]),
  ].map(t => `<div class="tile"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></div>`).join("");

  const rated = list.filter(m => avgOf(m) != null).sort((a, b) => avgOf(b) - avgOf(a));
  let hl = "";
  if (rated.length) {
    hl += `<div class="line">🏆 <b>${esc(rated[0].title)}</b> <small>★ ${fmt(avgOf(rated[0]))}</small></div>`;
    if (rated.length > 1) hl += `<div class="line">💩 <b>${esc(rated[rated.length - 1].title)}</b> <small>★ ${fmt(avgOf(rated[rated.length - 1]))}</small></div>`;
  }
  if (PEOPLE.length >= 2) {
    const [p, q] = PEOPLE;
    const both = list.filter(m => typeof m.ratings?.[p.id] === "number" && typeof m.ratings?.[q.id] === "number")
      .map(m => ({ m, d: Math.abs(m.ratings[p.id] - m.ratings[q.id]) }));
    if (both.length) {
      const top = both.sort((x, y) => y.d - x.d)[0];
      hl += `<div class="line">⚖️ Diferencia media entre vuestras notas: <b>${fmt(mean(both.map(x => x.d)))}</b></div>`;
      if (top.d > 0) hl += `<div class="line">🥊 Más discutida: <b>${esc(top.m.title)}</b> <small>${esc(p.name)} ${fmt(top.m.ratings[p.id])} · ${esc(q.name)} ${fmt(top.m.ratings[q.id])}</small></div>`;
    }
  }

  const sec = (title, entries) => entries.length ? `<h4>${title}</h4>${bars(entries)}` : "";
  let time = "";
  if (/^\d{4}$/.test(yearFilter)) {
    const c = Array(12).fill(0);
    list.forEach(m => { if (m.watchedOn) c[parseInt(m.watchedOn.slice(5, 7), 10) - 1]++; });
    time = sec("Por mes", MESES.map((l, i) => [l, c[i]]));
  } else if (yearFilter === "all") {
    time = sec("Por año", countBy(list.filter(m => m.watchedOn), m => m.watchedOn.slice(0, 4)).sort((a, b) => a[0].localeCompare(b[0])));
  }

  box.innerHTML = `<div class="tiles">${tiles}</div>${hl ? `<h4>Destacadas</h4>${hl}` : ""}
    ${sec("Idioma", countBy(list, m => m.lang))}
    ${sec("Cines", countBy(list, m => m.cinema).slice(0, 5))}
    ${sec("Géneros", countBy(list, m => m.genres || []).slice(0, 6))}
    ${sec("Directores", countBy(list, m => m.director ? m.director.split(", ") : []).filter(e => e[1] > 1).slice(0, 4))}
    ${time}`;
}

// ---------- Detalle ----------
let openId = null;
function openDetail(id) { openId = id; renderDetail(id); $("detailModal").classList.remove("hidden"); }
function closeDetail() { openId = null; $("detailModal").classList.add("hidden"); }
$("detailModal").onclick = (e) => { if (e.target === $("detailModal")) closeDetail(); };

function renderDetail(id) {
  const m = movies.find(x => x.id === id);
  if (!m) { closeDetail(); return; }
  // No re-renderizar mientras alguien está escribiendo en el formulario
  const ae = document.activeElement;
  if (ae && $("detailSheet").contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;

  const a = avgOf(m);
  const myRating = m.ratings?.[me] ?? 5;
  const others = PEOPLE.filter(p => p.id !== me).map(p => `
    <div class="block"><h3>${esc(p.name)}: ★ ${fmt(m.ratings?.[p.id])}</h3>
    <div class="overview" style="margin:0">${esc(m.comments?.[p.id] || "Sin comentario")}</div></div>`).join("");

  const metaRows = [
    ["Estreno", fmtDate(m.releaseDate)],
    ["Género", (m.genres || []).join(", ")],
    ["Director", m.director],
    ["Duración", fmtRuntime(m.runtime)],
  ].filter(r => r[1]).map(r => `<div><b>${r[0]}:</b> ${esc(r[1])}</div>`).join("");

  // Sugerencias de cine: las de por defecto + las ya usadas
  const cinemas = [...new Set([...DEFAULT_CINEMAS, ...movies.map(x => x.cinema).filter(Boolean)])];
  const langOpts = ["", ...LANGS, ...(m.lang && !LANGS.includes(m.lang) ? [m.lang] : [])]
    .map(l => `<option value="${esc(l)}" ${l === (m.lang || "") ? "selected" : ""}>${l || "—"}</option>`).join("");

  $("detailSheet").innerHTML = `
    <div class="row">
      ${m.poster ? `<img src="${IMG}w185${m.poster}" alt="">` : ""}
      <div><h2>${esc(m.title)}</h2><div class="y" style="color:var(--muted)">${esc(m.year || "")}</div>
      <span class="avg ${a == null ? "none" : ""}">Media ★ ${fmt(a)}</span>
      <div class="meta">${metaRows || "Cargando ficha…"}</div></div>
    </div>
    <div class="overview">${esc(m.overview || "")}</div>

    <div class="block"><h3>🎟️ Cuándo y dónde la vimos</h3>
      <div class="two">
        <div><label>Fecha</label><input type="date" id="vDate" value="${esc(m.watchedOn || "")}"></div>
        <div><label>Idioma</label><select id="vLang">${langOpts}</select></div>
      </div>
      <label>Cine</label>
      <input id="vCinema" list="cinemaList" placeholder="Elige uno o escribe otro…" value="${esc(m.cinema || "")}" autocomplete="off">
      <datalist id="cinemaList">${cinemas.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
      <div class="actions"><button class="btn" id="saveVisit">Guardar visita</button></div>
    </div>

    <div class="block mine"><h3>Tu nota (${esc(nameOf(me))})</h3>
      <div class="rate"><input type="range" id="myRating" min="0" max="10" step="0.5" value="${myRating}">
      <span class="val" id="myVal">${fmt(m.ratings?.[me])}</span></div>
      <textarea id="myComment" rows="3" placeholder="Tu comentario…" style="margin-top:10px">${esc(m.comments?.[me] || "")}</textarea>
      <div class="actions"><button class="btn" id="saveMine">Guardar mi nota</button></div>
    </div>
    ${others}
    <div class="actions"><button class="btn danger" id="delBtn">Eliminar</button><button class="btn ghost" id="closeDetail">Cerrar</button></div>`;

  const r = $("myRating"), v = $("myVal");
  r.oninput = () => { v.textContent = fmt(parseFloat(r.value)); };
  $("closeDetail").onclick = closeDetail;
  $("saveVisit").onclick = async () => {
    await updateDoc(doc(moviesCol, id), {
      watchedOn: $("vDate").value || null,
      cinema: $("vCinema").value.trim() || null,
      lang: $("vLang").value || null,
    });
    toast("Visita guardada");
  };
  $("saveMine").onclick = async () => {
    await updateDoc(doc(moviesCol, id), {
      [`ratings.${me}`]: parseFloat(r.value),
      [`comments.${me}`]: $("myComment").value.trim(),
    });
    toast("Nota guardada");
  };
  $("delBtn").onclick = async () => {
    if (confirm(`¿Eliminar “${m.title}” para los dos?`)) { await deleteDoc(doc(moviesCol, id)); closeDetail(); }
  };
}

// ---------- Añadir (TMDB) ----------
let t = null;
$("addBtn").onclick = () => { $("addModal").classList.remove("hidden"); $("searchInput").focus(); };
$("closeAdd").onclick = () => $("addModal").classList.add("hidden");
$("addModal").onclick = (e) => { if (e.target === $("addModal")) $("addModal").classList.add("hidden"); };
$("searchInput").oninput = () => { clearTimeout(t); t = setTimeout(search, 350); };

async function search() {
  const q = $("searchInput").value.trim();
  const box = $("results");
  if (q.length < 2) { box.innerHTML = ""; return; }
  if (TMDB_API_KEY === "PEGA_AQUI") { box.innerHTML = `<div class="err">Falta la clave de TMDB en config.js</div>`; return; }
  try {
    const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=es-ES&include_adult=false&query=${encodeURIComponent(q)}`);
    const data = await r.json();
    const res = (data.results || []).slice(0, 8);
    box.innerHTML = res.length ? res.map(x => `
      <div class="res" data-id="${x.id}">
        ${x.poster_path ? `<img src="${IMG}w92${x.poster_path}" alt="">` : `<div class="np"></div>`}
        <div><div>${esc(x.title)}</div><div class="sub">${esc((x.release_date || "").slice(0, 4))} · ${esc(x.original_title)}</div></div>
      </div>`).join("") : `<div class="sub" style="color:var(--muted)">Sin resultados</div>`;
    box._res = res;
  } catch { box.innerHTML = `<div class="err">Error al buscar. ¿Clave de TMDB correcta?</div>`; }
}
$("results").onclick = async (e) => {
  const el = e.target.closest(".res"); if (!el) return;
  const x = ($("results")._res || []).find(r => String(r.id) === el.dataset.id); if (!x) return;
  const id = String(x.id);
  if (movies.some(m => m.id === id)) { alert("Esa película ya está en la lista."); return; }
  let info = {};
  try { info = await fetchDetails(id); } catch (err) { console.warn(err); } // si falla, se completa luego solo
  await setDoc(doc(moviesCol, id), {
    title: x.title, year: (x.release_date || "").slice(0, 4), poster: x.poster_path || null,
    overview: x.overview || "", addedBy: me, ratings: {}, comments: {}, createdAt: serverTimestamp(),
    watchedOn: todayStr(), cinema: null, lang: null,
    ...info,
  });
  $("addModal").classList.add("hidden");
  $("searchInput").value = ""; $("results").innerHTML = "";
  openDetail(id);
};

// ---------- Importar desde pelis-import.json ----------
let importRows = [];
const imdbExists = (cand) => cand && movies.some(m => m.id === String(cand.id));

async function searchTmdb(q) {
  const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=es-ES&include_adult=false&query=${encodeURIComponent(q)}`);
  const d = await r.json();
  return (d.results || []).slice(0, 6);
}
async function matchRow(row, q = row.title) {
  let c = [];
  try { c = await searchTmdb(q); } catch (e) { console.warn(e); }
  if (row.yearHint) { // las de año cercano al apuntado en el Excel, primero
    const near = (x) => Math.abs(parseInt((x.release_date || "0").slice(0, 4), 10) - row.yearHint) <= 1;
    c = [...c.filter(near), ...c.filter(x => !near(x))];
  }
  row.cands = c; row.sel = 0;
  row.checked = c.length > 0 && !imdbExists(c[0]) && !!(row.watchedOn || row.notas?.some(n => n != null));
}

function renderImport() {
  $("importList").innerHTML = importRows.map((r, i) => {
    const c = r.cands[r.sel];
    const exists = imdbExists(c);
    const notes = (r.notasRaw || []).map(n => n ?? "–").join(" / ");
    const info = [r.watchedOn ? "📅 " + fmtDate(r.watchedOn) : "sin fecha", "notas " + notes].join(" · ");
    const pending = !r.watchedOn && !(r.notas || []).some(n => n != null);
    return `<div class="imp ${exists || !c ? "off" : ""}">
      <input type="checkbox" data-chk="${i}" ${r.checked && c && !exists ? "checked" : ""} ${!c || exists ? "disabled" : ""}>
      <div class="grow">
        <div class="sub">Excel: <b>${esc(r.original)}</b> · ${esc(info)}${pending ? " · (sin fecha ni notas, ¿pendiente de ver?)" : ""}</div>
        ${c ? `<select data-sel="${i}">${r.cands.map((x, j) => `<option value="${j}" ${j === r.sel ? "selected" : ""}>${esc(x.title)} (${esc((x.release_date || "").slice(0, 4))})</option>`).join("")}</select>`
            : `<div class="err" style="margin:6px 0 0">Sin coincidencias</div>`}
        ${exists ? `<div class="sub">Ya está en vuestra lista</div>` : ""}
        <button class="btn ghost small" data-redo="${i}">Buscar otro título</button>
      </div>
      ${c?.poster_path ? `<img src="${IMG}w92${c.poster_path}" alt="">` : `<div class="np"></div>`}
    </div>`;
  }).join("");
  const n = importRows.filter(r => r.checked && r.cands[r.sel] && !imdbExists(r.cands[r.sel])).length;
  $("importGo").textContent = `Importar ${n} películas`;
  $("importGo").disabled = n === 0;
}

$("importBtn").onclick = () => { $("importModal").classList.remove("hidden"); };
$("importClose").onclick = () => $("importModal").classList.add("hidden");
$("importFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  if (TMDB_API_KEY === "PEGA_AQUI") { $("importStatus").textContent = "Falta la clave de TMDB en config.js"; return; }
  let data;
  try { data = JSON.parse(await f.text()); if (!Array.isArray(data)) throw 0; }
  catch { $("importStatus").textContent = "El archivo no es válido."; return; }
  importRows = data.map(r => ({ ...r, cands: [], sel: 0, checked: false }));
  $("importGo").disabled = true;
  for (let i = 0; i < importRows.length; i++) {
    $("importStatus").textContent = `Buscando coincidencias… ${i + 1}/${importRows.length}`;
    await matchRow(importRows[i]);
  }
  $("importStatus").textContent = "Revisa las coincidencias (puedes cambiarlas) y pulsa Importar.";
  renderImport();
};
$("importList").onchange = (e) => {
  const t = e.target;
  if (t.dataset.chk != null) importRows[+t.dataset.chk].checked = t.checked;
  if (t.dataset.sel != null) { const r = importRows[+t.dataset.sel]; r.sel = +t.value; r.checked = !imdbExists(r.cands[r.sel]); }
  renderImport();
};
$("importList").onclick = async (e) => {
  const b = e.target.closest("[data-redo]"); if (!b) return;
  const r = importRows[+b.dataset.redo];
  const q = prompt("Título a buscar en TMDB:", r.title);
  if (!q) return;
  b.disabled = true; b.textContent = "Buscando…";
  await matchRow(r, q);
  r.checked = !!r.cands[0] && !imdbExists(r.cands[0]);
  renderImport();
};
$("importGo").onclick = async () => {
  const todo = importRows.filter(r => r.checked && r.cands[r.sel] && !imdbExists(r.cands[r.sel]));
  $("importGo").disabled = true;
  const used = new Set(); let ok = 0, fail = [];
  for (const r of todo) {
    const x = r.cands[r.sel], id = String(x.id);
    if (used.has(id)) continue; used.add(id);
    $("importStatus").textContent = `Importando ${ok + fail.length + 1}/${todo.length}: ${x.title}`;
    try {
      let info = {};
      try { info = await fetchDetails(id); } catch (err) { console.warn(err); }
      const ratings = {};
      PEOPLE.forEach((p, i) => { const v = r.notas?.[i]; if (typeof v === "number") ratings[p.id] = v; });
      await setDoc(doc(moviesCol, id), {
        title: x.title, year: (x.release_date || "").slice(0, 4), poster: x.poster_path || null,
        overview: x.overview || "", addedBy: me, ratings, comments: {}, createdAt: serverTimestamp(),
        watchedOn: r.watchedOn || null, cinema: null, lang: null, ...info,
      });
      ok++;
    } catch (err) { console.error(err); fail.push(r.original); }
  }
  yearFilter = "all"; render();
  $("importStatus").textContent = `Listo: ${ok} importadas` + (fail.length ? `, ${fail.length} con error (${fail.join(", ")})` : "") + ".";
  importRows = importRows.filter(r => !(r.checked && r.cands[r.sel] && used.has(String(r.cands[r.sel].id))));
  renderImport();
};
</script>
